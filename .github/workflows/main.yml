name: Build Krishna Offset APK

on:
workflow_dispatch:
push:
paths:
- '*.zip'
- '.github/workflows/build-apk.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract Android project
    run: |
      ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: Repository root mein ZIP file nahi mili."
        exit 1
      fi
      mkdir -p extracted
      unzip -q "$ZIP_FILE" -d extracted
      PROJECT_DIR=$(find extracted -name settings.gradle -type f -printf '%h\n' | head -n 1)
      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: ZIP mein settings.gradle nahi mila."
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Build Debug APK
    run: |
      cd "$PROJECT_DIR"
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Krishna-Offset-APK
      path: extracted/**/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
